name: Data correction
description: Report an incorrect record with evidence.
title: "[Correction] "
body:
  - type: input
    id: record
    attributes:
      label: Page
      description: Paste the link to the item, quest, NPC or dungeon page.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Game version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Contribution
      description: What should change? Include observations and drag screenshots here.
    validations:
      required: true
