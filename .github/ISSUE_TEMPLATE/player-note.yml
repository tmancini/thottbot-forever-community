name: Player note or screenshot
description: Share a practical tip or in-game observation.
title: "[Player note] "
labels: [player-note]
body:
  - type: input
    id: record
    attributes:
      label: Page
      description: Paste the link to the item, quest, NPC or dungeon page.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Game version
      description: The game version you were playing when you saw this.
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution
      description: Share your tip and tell us where and when you saw it in game. Drag screenshots here.
    validations:
      required: true
